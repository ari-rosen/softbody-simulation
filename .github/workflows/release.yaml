name: Automated Release

on:
  push:
    tags:
      - 'v*' # Triggers automatically on tags like v1.0.0

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux Graphics/Audio Headers
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev xorg-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path build/Release/soft_body_sim.exe -DestinationPath soft_body_sim-windows-x86_64.zip

      - name: Package Binary (Linux & macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          # Copy binary (Linux puts it in build/, macOS might put it in build/Release/ depending on generator)
          cp build/soft_body_sim dist/ 2>/dev/null || cp build/Release/soft_body_sim dist/
          tar -czvf soft_body_sim-${{ matrix.os }}.tar.gz -C dist .

      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.zip
            *.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
